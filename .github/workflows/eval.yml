name: RAG Evaluation

# This workflow is the point of the project: quality is a build check, not an
# opinion. It runs the unit tests AND the evaluation gates on every push.
# Everything here uses the offline path, so no API key or secret is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest

      - name: Evaluation gates (fails the build on a regression)
        run: python evaluate.py --check-baseline

      - name: Upload the full run (aggregates + per-question evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: results/latest.json
          if-no-files-found: warn
