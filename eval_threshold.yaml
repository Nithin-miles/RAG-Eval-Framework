# Quality gates for `python evaluate.py`.
#
# Each line means: "if the pipeline scores below this, fail the build".
# The values are not sacred. They are a *policy you are choosing*, and the
# right way to pick them is:
#
#   1. run the existing system, note the scores (they are in baseline.json)
#   2. decide the floor you refuse to ship below
#   3. set the gate with a margin (roughly 0.05-0.10) below that floor
#   4. when the system improves, raise the gate so it cannot silently regress
#
# These values are calibrated for the offline default: vector retriever,
# hashing embeddings, deterministic extractive generator, k=3, chunk_size=240.
# Swap in a real LLM generator and the scores - and the right gates - change.

faithfulness: 0.90
answer_relevance: 0.42
context_precision: 0.75
context_recall: 0.90
answer_correctness: 0.70

# Only measured on the questions the corpus cannot answer ("answerable": false).
# A confident wrong answer is worse than an honest "I don't know".
refusal_accuracy: 0.80
